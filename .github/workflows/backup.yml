name: Sauvegarde chiffrée de la caisse
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: read
jobs:
  backup:
    if: vars.CAISSE_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installer le chiffrement
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Créer une sauvegarde cohérente des seules tables caisse
        env:
          PGHOST: ${{ secrets.CAISSE_PGHOST }}
          PGPORT: ${{ secrets.CAISSE_PGPORT }}
          PGUSER: ${{ secrets.CAISSE_PGUSER }}
          PGPASSWORD: ${{ secrets.CAISSE_PGPASSWORD }}
          PGDATABASE: postgres
          AGE_RECIPIENT: ${{ vars.CAISSE_AGE_RECIPIENT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PGHOST:?Missing CAISSE_PGHOST}" "${PGUSER:?Missing CAISSE_PGUSER}" "${PGPASSWORD:?Missing CAISSE_PGPASSWORD}" "${AGE_RECIPIENT:?Missing CAISSE_AGE_RECIPIENT}"
          mkdir -p backups
          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE=require postgres:17 pg_dump --format=custom --data-only --table='public.caisse_*' --no-owner --no-privileges | age --recipient "$AGE_RECIPIENT" > backups/dipsy-caisse.dump.age
          test -s backups/dipsy-caisse.dump.age
          sha256sum backups/dipsy-caisse.dump.age > backups/dipsy-caisse.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: caisse-encrypted-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
